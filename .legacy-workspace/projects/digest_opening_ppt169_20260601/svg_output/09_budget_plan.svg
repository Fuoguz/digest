    <use data-icon="chunk-filled/route" x="618" y="232" width="34" height="34" fill="#3BA7FF"/>
    <text x="668" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">实施计划</text>
    <line x1="646" y1="350" x2="1174" y2="350" stroke="url(#timelineGrad)" stroke-width="6" stroke-linecap="round"/>
    <g id="milestone-1">
      <circle cx="646" cy="350" r="10" fill="#3BA7FF"/>
      <text x="646" y="314" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#3BA7FF">2026.6-7</text>
      <text x="646" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">资料查阅</text>
      <text x="646" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">项目定位</text>
    </g>
    <g id="milestone-2">
      <circle cx="722" cy="350" r="10" fill="#3BA7FF"/>
      <text x="722" y="314" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#3BA7FF">7-8</text>
      <text x="722" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">产品方案</text>
      <text x="722" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">设计</text>
    </g>
    <g id="milestone-3">
      <circle cx="798" cy="350" r="10" fill="#20E3B2"/>
      <text x="798" y="314" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#20E3B2">8-9</text>
      <text x="798" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">原型优化</text>
      <text x="798" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">开题准备</text>
    </g>
    <g id="milestone-4">
      <circle cx="874" cy="350" r="10" fill="#20E3B2"/>
      <text x="874" y="314" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#20E3B2">9-11</text>
      <text x="874" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">用户调研</text>
      <text x="874" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">竞品分析</text>
    </g>
    <g id="milestone-5">
      <circle cx="950" cy="350" r="10" fill="#20E3B2"/>
      <text x="950" y="314" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#20E3B2">11-12</text>
      <text x="950" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">校内试用</text>
      <text x="950" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">中期检查</text>
    </g>
    <g id="milestone-6">
      <circle cx="1026" cy="350" r="10" fill="#7C5CFF"/>
      <text x="1026" y="314" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#7C5CFF">12-1</text>
      <text x="1026" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">反馈整理</text>
      <text x="1026" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">产品迭代</text>
    </g>
    <g id="milestone-7">
      <circle cx="1102" cy="350" r="10" fill="#7C5CFF"/>
      <text x="1102" y="314" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#7C5CFF">2027.1-3</text>
      <text x="1102" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">创业材料</text>
      <text x="1102" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">撰写</text>
    </g>
    <g id="milestone-8">
      <circle cx="1174" cy="350" r="10" fill="#7C5CFF"/>
      <text x="1174" y="314" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#7C5CFF">3-4</text>
      <text x="1174" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">结项答辩</text>
      <text x="1174" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">成果推广</text>
    </g>
    <rect x="636" y="472" width="540" height="78" rx="16" fill="#13243A" stroke="#243A55" stroke-width="1"/>
    <use data-icon="chunk-filled/calendar" x="664" y="494" width="32" height="32" fill="#20E3B2"/>
    <text x="714" y="510" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4F8FF">一年内可交付</text>
    <text x="714" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#A9B8CD">网页原型 + 用户验证 + 校内试用 + 结项材料</text>
  </g>
  <g id="footer">
    <text x="56" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6D7E96">沉淀 Digest 开题答辩</text>
    <text x="1224" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6D7E96">09 / 10</text>
  </g>
</svg>
