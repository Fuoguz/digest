<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="timelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3BA7FF"/>
      <stop offset="55%" stop-color="#20E3B2"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1280" height="720" fill="#08111F"/>
    <circle cx="240" cy="426" r="260" fill="#3BA7FF" fill-opacity="0.05"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#20E3B2">经费预算与实施计划</text>
    <text x="56" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800" fill="#F4F8FF">15000 元经费，聚焦原型开发、用户验证与校内试用</text>
    <text x="56" y="151" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">预算投向清晰，计划覆盖 2026.6 到 2027.4，一年内可落地。</text>
  </g>
  <g id="budget-panel">
    <rect x="56" y="202" width="500" height="430" rx="22" fill="#101B2E" stroke="#243A55" stroke-width="1.2"/>
    <use data-icon="chunk-filled/chart-pie" x="88" y="232" width="34" height="34" fill="#20E3B2"/>
    <text x="138" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">预算分配</text>
    <g id="chartArea">
      <!-- chart-plot-area: donut | center: 266,420 | outer-radius: 132 | inner-radius: 78 -->
      <path d="M 266,288 A 132,132 0 0,1 397.3,433.8 L 343.6,428.2 A 78,78 0 0,0 266,342 Z" fill="#3BA7FF"/>
      <path d="M 397.3,433.8 A 132,132 0 0,1 293.4,549.1 L 282.2,496.3 A 78,78 0 0,0 343.6,428.2 Z" fill="#20E3B2"/>
      <path d="M 293.4,549.1 A 132,132 0 0,1 188.4,526.8 L 220.2,483.1 A 78,78 0 0,0 282.2,496.3 Z" fill="#7C5CFF"/>
      <path d="M 188.4,526.8 A 132,132 0 0,1 134.7,433.8 L 188.4,428.2 A 78,78 0 0,0 220.2,483.1 Z" fill="#FFC857"/>
      <path d="M 134.7,433.8 A 132,132 0 0,1 167.9,331.7 L 208.0,367.8 A 78,78 0 0,0 188.4,428.2 Z" fill="#FF5A7A"/>
      <path d="M 167.9,331.7 A 132,132 0 0,1 238.6,290.9 L 249.8,343.7 A 78,78 0 0,0 208.0,367.8 Z" fill="#31506F"/>
      <path d="M 238.6,290.9 A 132,132 0 0,1 266,288 L 266,342 A 78,78 0 0,0 249.8,343.7 Z" fill="#6D7E96"/>
      <circle cx="266" cy="420" r="74" fill="#101B2E"/>
      <text x="266" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="800" fill="#F4F8FF">15000</text>
      <text x="266" y="442" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">元合计</text>
    </g>
    <g id="budget-legend">
      <rect x="410" y="300" width="12" height="12" rx="3" fill="#3BA7FF"/>
      <text x="432" y="311" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">产品开发 4000</text>
      <rect x="410" y="328" width="12" height="12" rx="3" fill="#20E3B2"/>
      <text x="432" y="339" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">API 与服务器 3000</text>
      <rect x="410" y="356" width="12" height="12" rx="3" fill="#7C5CFF"/>
      <text x="432" y="367" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">用户调研 2000</text>
      <rect x="410" y="384" width="12" height="12" rx="3" fill="#FFC857"/>
      <text x="432" y="395" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">UI 视觉 2000</text>
      <rect x="410" y="412" width="12" height="12" rx="3" fill="#FF5A7A"/>
      <text x="432" y="423" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">测试推广 2000</text>
      <rect x="410" y="440" width="12" height="12" rx="3" fill="#31506F"/>
      <text x="432" y="451" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">展示视频 1500</text>
      <rect x="410" y="468" width="12" height="12" rx="3" fill="#6D7E96"/>
      <text x="432" y="479" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#A9B8CD">其他支出 500</text>
    </g>
  </g>
  <g id="plan-panel">
