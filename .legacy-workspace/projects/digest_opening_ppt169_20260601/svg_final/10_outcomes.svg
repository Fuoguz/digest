<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="roadLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3BA7FF" />
      <stop offset="55%" stop-color="#20E3B2" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>
    <radialGradient id="endGlow" cx="72%" cy="72%" r="54%">
      <stop offset="0%" stop-color="#20E3B2" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#20E3B2" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g id="background">
    <rect width="1280" height="720" fill="#08111F" />
    <rect width="1280" height="720" fill="url(#endGlow)" />
  </g>
  <g id="header">
    <text x="56" y="72" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#20E3B2">预期成果与未来规划</text>
    <text x="56" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800" fill="#F4F8FF">从大创原型走向真实可用的校园 AI 学习产品</text>
    <text x="56" y="151" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">以校内小范围试用为起点，逐步扩展到课程学习和学生赛事场景。</text>
  </g>
  <g id="outcomes-panel">
    <path fill="#101B2E" stroke="#243A55" stroke-width="1.2" d="M78,206 H568 A22,22 0 0 1 590,228 V512 A22,22 0 0 1 568,534 H78 A22,22 0 0 1 56,512 V228 A22,22 0 0 1 78,206 Z" />
    
  <g transform="translate(88.0, 236.0) scale(2.125)" fill="#20E3B2">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 4C5.79086 4 4 5.79086 4 8C4 10.2091 5.79086 12 8 12C10.2091 12 12 10.2091 12 8C12 5.79086 10.2091 4 8 4ZM6 8C6 6.89543 6.89543 6 8 6C9.10457 6 10 6.89543 10 8C10 9.10457 9.10457 10 8 10C6.89543 10 6 9.10457 6 8Z" />
    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0ZM2 8C2 4.68629 4.68629 2 8 2C11.3137 2 14 4.68629 14 8C14 11.3137 11.3137 14 8 14C4.68629 14 2 11.3137 2 8Z" />
  </g>
    <text x="138" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">预期成果</text>
    <g id="outcome-list">
      <circle cx="96" cy="306" r="5" fill="#20E3B2" />
      <text x="118" y="312" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">完成 Digest AI 知识内化平台网页原型</text>
      <circle cx="96" cy="350" r="5" fill="#3BA7FF" />
      <text x="118" y="356" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">形成用户需求调研报告与竞品分析报告</text>
      <circle cx="96" cy="394" r="5" fill="#7C5CFF" />
      <text x="118" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">完成创业计划书和模拟运营报告</text>
      <circle cx="96" cy="438" r="5" fill="#FFC857" />
      <text x="118" y="444" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">制作答辩 PPT、演示视频和宣传材料</text>
      <circle cx="96" cy="482" r="5" fill="#20E3B2" />
      <text x="118" y="488" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">推动校内小范围试用并持续迭代</text>
    </g>
  </g>
  <g id="roadmap-panel">
    <path fill="#101B2E" stroke="#243A55" stroke-width="1.2" d="M650,206 H1202 A22,22 0 0 1 1224,228 V512 A22,22 0 0 1 1202,534 H650 A22,22 0 0 1 628,512 V228 A22,22 0 0 1 650,206 Z" />
    
  <g transform="translate(660.0, 236.0) scale(2.125)" fill="#3BA7FF">
    <path d="M5 3C5 4.10457 4.10457 5 3 5C1.89543 5 1 4.10457 1 3C1 1.89543 1.89543 1 3 1C4.10457 1 5 1.89543 5 3Z" />
    <path d="M15 13C15 14.1046 14.1046 15 13 15C11.8954 15 11 14.1046 11 13C11 11.8954 11.8954 11 13 11C14.1046 11 15 11.8954 15 13Z" />
    <path d="M9 4.5C9 3.67157 9.67157 3 10.5 3C11.3284 3 12 3.67157 12 4.5V9H14V4.5C14 2.567 12.433 1 10.5 1C8.567 1 7 2.567 7 4.5V11.5C7 12.3284 6.32843 13 5.5 13C4.67157 13 4 12.3284 4 11.5V7H2V11.5C2 13.433 3.567 15 5.5 15C7.433 15 9 13.433 9 11.5V4.5Z" />
  </g>
    <text x="710" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">未来三阶段</text>
    <line x1="690" y1="314" x2="690" y2="488" stroke="url(#roadLine)" stroke-width="5" stroke-linecap="round" />
    <g id="stage-one">
      <circle cx="690" cy="326" r="17" fill="#3BA7FF" />
      <text x="690" y="333" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">1</text>
      <text x="730" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4F8FF">课程基础能力</text>
      <text x="730" y="348" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#A9B8CD">课程库、每日 Digest、PPT 截图 OCR、基础知识图谱</text>
    </g>
    <g id="stage-two">
      <circle cx="690" cy="406" r="17" fill="#20E3B2" />
      <text x="690" y="413" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#08111F">2</text>
      <text x="730" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4F8FF">复习闭环增强</text>
      <text x="730" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#A9B8CD">课堂录音转写、期末复习包、复习提醒、导出功能</text>
    </g>
    <g id="stage-three">
      <circle cx="690" cy="486" r="17" fill="#7C5CFF" />
      <text x="690" y="493" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3</text>
      <text x="730" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4F8FF">校园赛事与专业拓展</text>
      <text x="730" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#A9B8CD">法学案例、政策文本、团队项目资料，中国国际大学生创新大赛等</text>
    </g>
  </g>
  <g id="closing-quote">
    <path fill="#20E3B2" fill-opacity="0.12" stroke="#20E3B2" stroke-width="1.4" d="M122,568 H1158 A28,28 0 0 1 1186,596 V618 A28,28 0 0 1 1158,646 H122 A28,28 0 0 1 94,618 V596 A28,28 0 0 1 122,568 Z" />
    
  <g transform="translate(128.0, 590.0) scale(2.125)" fill="#20E3B2">
    <path d="M8 3L10.5 2.5L11 0H12L12.5 2.5L15 3V4L12.5 4.5L12 7H11L10.5 4.5L8 4V3Z" />
    <path d="M0 11V10L4 9L5 5H6L7 9L11 10V11L7 12L6 16H5L4 12L0 11Z" />
    <path d="M1 2L2.5 0.5L4 2L2.5 3.5L1 2Z" />
    <path d="M15 14L13 12L11 14L13 16L15 14Z" />
    <path d="M15 10C15.5523 10 16 9.55229 16 9C16 8.44771 15.5523 8 15 8C14.4477 8 14 8.44771 14 9C14 9.55229 14.4477 10 15 10Z" />
  </g>
    <text x="184" y="609" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800" fill="#F4F8FF">Digest 想做的不是替学生学习，</text>
    <text x="526" y="609" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800" fill="#20E3B2">而是帮助学生把每天学过的东西真正留下来。</text>
    <text x="640" y="636" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#A9B8CD">谢谢各位老师，欢迎批评指正。</text>
  </g>
  <g id="footer">
    <text x="56" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6D7E96">沉淀 Digest 开题答辩</text>
    <text x="1224" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6D7E96">10 / 10</text>
  </g>
</svg>