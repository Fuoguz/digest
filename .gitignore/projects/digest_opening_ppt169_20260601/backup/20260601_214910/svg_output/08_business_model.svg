<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="stairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3BA7FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#20E3B2" stop-opacity="0.12"/>
    </linearGradient>
    <marker id="upArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#20E3B2"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="1280" height="720" fill="#08111F"/>
    <circle cx="236" cy="590" r="230" fill="#3BA7FF" fill-opacity="0.05"/>
    <circle cx="1078" cy="186" r="250" fill="#20E3B2" fill-opacity="0.06"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#20E3B2">商业模式与用户付费逻辑</text>
    <text x="56" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800" fill="#F4F8FF">学生不是为 AI 总结付费，而是为节省期末复习时间付费</text>
    <text x="56" y="151" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">先降低使用门槛，再围绕学期和课程复习形成付费场景。</text>
  </g>
  <g id="value-core">
    <rect x="64" y="212" width="300" height="364" rx="22" fill="#101B2E" stroke="#243A55" stroke-width="1.2"/>
    <use data-icon="chunk-filled/clock" x="94" y="246" width="46" height="46" fill="#20E3B2"/>
    <text x="158" y="266" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#F4F8FF">核心付费理由</text>
    <text x="94" y="326" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="800" fill="#20E3B2">省时间</text>
    <text x="94" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4F8FF">降低期末整理成本</text>
    <line x1="94" y1="404" x2="334" y2="404" stroke="#243A55" stroke-width="1"/>
    <text x="94" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">不是卖“万能答案”</text>
    <text x="94" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">而是卖“可复习资产”</text>
    <text x="94" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">更适合学期制、课程制场景</text>
  </g>
  <g id="staircase">
    <path d="M 420 568 L 420 512 L 574 512 L 574 456 L 728 456 L 728 400 L 882 400 L 882 344 L 1036 344 L 1036 288 L 1190 288" fill="none" stroke="#20E3B2" stroke-width="4" marker-end="url(#upArrow)"/>
    <g id="tier-free">
      <rect x="408" y="470" width="166" height="98" rx="16" fill="#101B2E" stroke="#243A55" stroke-width="1.2"/>
      <text x="436" y="506" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">免费入口</text>
      <text x="436" y="536" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">文本输入、AI 摘要</text>
      <text x="436" y="558" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">少量复习问题</text>
    </g>
    <g id="tier-semester">
      <rect x="592" y="414" width="166" height="154" rx="16" fill="#101B2E" stroke="#3BA7FF" stroke-width="1.2"/>
      <text x="620" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">学期卡</text>
      <text x="620" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">更多知识节点</text>
      <text x="620" y="502" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">更长文本处理</text>
      <text x="620" y="524" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">复习计划提醒</text>
    </g>
    <g id="tier-course">
      <rect x="776" y="358" width="166" height="210" rx="16" fill="url(#stairGrad)" stroke="#20E3B2" stroke-width="1.4"/>
      <text x="804" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">课程复习包</text>
      <text x="804" y="424" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">重点概念表</text>
      <text x="804" y="446" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">章节框架</text>
      <text x="804" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">知识图谱</text>
      <text x="804" y="490" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">自测题</text>
      <text x="804" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">可打印资料</text>
    </g>
    <g id="tier-media">
      <rect x="960" y="302" width="166" height="266" rx="16" fill="#101B2E" stroke="#7C5CFF" stroke-width="1.2"/>
      <text x="988" y="338" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">音视频额度</text>
      <text x="988" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">课堂录音</text>
      <text x="988" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">学习视频</text>
      <text x="988" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#A9B8CD">按时长或额度</text>
      <use data-icon="chunk-filled/video" x="996" y="456" width="40" height="40" fill="#7C5CFF"/>
      <use data-icon="chunk-filled/microphone" x="1054" y="456" width="40" height="40" fill="#7C5CFF"/>
    </g>
  </g>
  <g id="team-project">
    <rect x="408" y="212" width="718" height="72" rx="18" fill="#101B2E" stroke="#FFC857" stroke-width="1.2"/>
    <use data-icon="chunk-filled/users" x="438" y="232" width="32" height="32" fill="#FFC857"/>
    <text x="492" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F4F8FF">团队项目服务</text>
    <text x="492" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#A9B8CD">服务大创项目、课程小组、社会调查和创新创业赛事团队</text>
  </g>
  <g id="bottom-note">
    <rect x="224" y="612" width="832" height="42" rx="21" fill="#20E3B2" fill-opacity="0.12" stroke="#20E3B2" stroke-width="1"/>
    <text x="640" y="639" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800" fill="#F4F8FF">免费入口积累习惯，课程复习包承接期末高需求场景</text>
  </g>
  <g id="footer">
    <text x="56" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6D7E96">沉淀 Digest 开题答辩</text>
    <text x="1224" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6D7E96">08 / 10</text>
  </g>
</svg>
