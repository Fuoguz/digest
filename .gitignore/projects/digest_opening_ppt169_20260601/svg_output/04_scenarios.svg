<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3BA7FF"/>
    </marker>
    <linearGradient id="flowTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3BA7FF"/>
      <stop offset="50%" stop-color="#20E3B2"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1280" height="720" fill="#08111F"/>
    <rect x="56" y="176" width="1168" height="430" rx="24" fill="#0C1A2D" stroke="#243A55" stroke-width="1"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#20E3B2">核心使用场景</text>
    <text x="56" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800" fill="#F4F8FF">围绕大学生真实学习流程设计</text>
    <text x="56" y="151" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">从日常输入，到每日沉淀，再到期末输出。</text>
  </g>
  <g id="flow-track">
    <line x1="196" y1="240" x2="1084" y2="240" stroke="url(#flowTrack)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="196" cy="240" r="16" fill="#3BA7FF"/>
    <circle cx="640" cy="240" r="16" fill="#20E3B2"/>
    <circle cx="1084" cy="240" r="16" fill="#7C5CFF"/>
    <text x="196" y="214" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#3BA7FF">日常输入</text>
    <text x="640" y="214" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#20E3B2">每日沉淀</text>
    <text x="1084" y="214" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#7C5CFF">期末输出</text>
  </g>
  <g id="scene-class">
    <rect x="96" y="284" width="330" height="256" rx="18" fill="#101B2E" stroke="#243A55" stroke-width="1.2"/>
    <rect x="124" y="312" width="56" height="56" rx="16" fill="#3BA7FF" fill-opacity="0.14"/>
    <use data-icon="chunk-filled/file" x="138" y="326" width="28" height="28" fill="#3BA7FF"/>
    <text x="198" y="335" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#F4F8FF">场景一：日常上课</text>
    <text x="198" y="363" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#A9B8CD">拍老师 PPT，快速入库</text>
    <line x1="124" y1="396" x2="398" y2="396" stroke="#243A55" stroke-width="1"/>
    <text x="124" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#F4F8FF">学生拍 PPT 截图</text>
    <path d="M 124 454 L 238 454" stroke="#3BA7FF" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <text x="124" y="494" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">OCR 识别与提炼知识点</text>
    <text x="124" y="526" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#20E3B2">归入对应课程</text>
  </g>
  <g id="scene-after-class">
    <rect x="475" y="284" width="330" height="256" rx="18" fill="#101B2E" stroke="#20E3B2" stroke-width="1.2"/>
    <rect x="503" y="312" width="56" height="56" rx="16" fill="#20E3B2" fill-opacity="0.14"/>
    <use data-icon="chunk-filled/microphone" x="517" y="326" width="28" height="28" fill="#20E3B2"/>
    <text x="577" y="335" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#F4F8FF">场景二：课后整理</text>
    <text x="577" y="363" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#A9B8CD">录音、网页、视频统一处理</text>
    <line x1="503" y1="396" x2="777" y2="396" stroke="#243A55" stroke-width="1"/>
    <text x="503" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#F4F8FF">上传录音 / 网页 / 视频</text>
    <path d="M 503 454 L 617 454" stroke="#3BA7FF" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <text x="503" y="494" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">AI 转写、摘要、结构化</text>
    <text x="503" y="526" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#20E3B2">生成知识节点和复习问题</text>
  </g>
  <g id="scene-exam">
    <rect x="854" y="284" width="330" height="256" rx="18" fill="#101B2E" stroke="#7C5CFF" stroke-width="1.2"/>
    <rect x="882" y="312" width="56" height="56" rx="16" fill="#7C5CFF" fill-opacity="0.16"/>
    <use data-icon="chunk-filled/book-open" x="896" y="326" width="28" height="28" fill="#7C5CFF"/>
    <text x="956" y="335" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#F4F8FF">场景三：期末复习</text>
    <text x="956" y="363" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#A9B8CD">选择课程，一键生成资料包</text>
    <line x1="882" y1="396" x2="1156" y2="396" stroke="#243A55" stroke-width="1"/>
    <text x="882" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#F4F8FF">选择一门课</text>
    <path d="M 882 454 L 996 454" stroke="#3BA7FF" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <text x="882" y="494" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#A9B8CD">重点概念表、章节框架</text>
    <text x="882" y="526" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#20E3B2">知识图谱、自测题、可打印包</text>
  </g>
  <g id="bottom-takeaway">
    <rect x="192" y="580" width="896" height="48" rx="24" fill="#20E3B2" fill-opacity="0.12" stroke="#20E3B2" stroke-width="1"/>
    <text x="640" y="611" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4F8FF">关键不是多一个入口，而是把学习行为变成连续的课程资产</text>
  </g>
  <g id="footer">
    <text x="56" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6D7E96">沉淀 Digest 开题答辩</text>
    <text x="1224" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6D7E96">04 / 10</text>
  </g>
</svg>
